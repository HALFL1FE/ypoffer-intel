name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    # Avoid GitHub's busiest top-of-hour window and reduce no-op polling.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'HALFL1FE/ypoffer-intel'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Yeahpromos/offer-intelligence.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork is already up to date."
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin HEAD:main
